name: Setup
description: Setup
inputs:
    bunVersion:
        required: true
        description: The version of Bun to use
    cacheVersion:
        required: true
        description: The cache version to use (defined as a secret)
runs:
    using: composite
    steps:
        -   name: Setup Bun
            uses: oven-sh/setup-bun@v2
            with:
                bun-version: "${{ inputs.bunVersion }}"

        -   name: Cache dependencies
            uses: actions/cache@v4
            with:
                path: ~/.bun/install/cache
                key: ${{ inputs.cacheVersion }}-bun-${{ hashFiles('bun.lock') }}

        -   shell: bash
            run: bun install --frozen-lockfile
