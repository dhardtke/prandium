# Dependencies are pinned to exact versions in package.json. Without this,
# `bun add` would write a caret range again and quietly undo that.
[install]
exact = true

[fmt]
printWidth = 160
singleQuote = true
ignorePatterns = [
  "docs/agents/",
  "CLAUDE.md",
  "src/backend/features/recipes/internal/ingredient/parser.js",
  "src/backend/features/recipes/internal/ingredient/parser.d.ts",
  "src/backend/features/recipes/internal/import/**/*.html",
]

[[fmt.overrides]]
files = ["**/*.css"]
options = { singleQuote = false }
